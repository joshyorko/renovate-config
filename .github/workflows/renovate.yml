name: Patchraptor Renovate

on:
  pull_request:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/renovate.yml"
      - "renovate-config.json"
      - "org-inherited-config.json"
      - "scripts/sync-review-omp-pins.py"
      - "scripts/review-sdk-lock.py"
      - "scripts/verify-review-qualification.py"
      - "scripts/verify_patchraptor_repository_visibility.py"
      - "tests/test_review_pin_sync.py"
      - "tests/test_review_qualification.py"
      - "tests/test_review_sdk_lock.py"
      - "tests/test_patchraptor_config.py"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      log-level:
        description: "Set the Renovate log level"
        required: false
        default: info
        type: choice
        options:
          - info
          - debug
      qualification-only:
        description: "Qualify the existing Review OMP PR without running Renovate or writing receipts"
        required: false
        default: false
        type: boolean

concurrency:
  group: patchraptor-renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Patchraptor dependency sweep
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs['qualification-only'] != true
    steps:
      - name: Get Token
        id: get-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          client-id: ${{ secrets.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          token: ${{ steps.get-token.outputs.token }}
          persist-credentials: false

      - name: Verify Patchraptor target repository access
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp /installation/repositories \
            | python3 scripts/verify_patchraptor_repository_visibility.py

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@693b9ef15eec82123529a37c782242f091365961 # v46.1.14
        env:
          RENOVATE_DRY_RUN: ${{ github.event_name == 'pull_request' && 'full' }}
          LOG_LEVEL: ${{ github.event.inputs.log-level || 'info' }}
        with:
          token: ${{ steps.get-token.outputs.token }}
          configurationFile: ./renovate-config.json

  qualification-tests:
    name: Review qualification contract tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - run: python3 tests/test_review_qualification.py
      - run: python3 tests/test_review_pin_sync.py
      - run: python3 tests/test_review_sdk_lock.py
      - run: python3 tests/test_patchraptor_config.py

  qualify-review-omp:
    name: Qualify Review OMP update without write credentials
    needs: renovate
    if: >-
      always() && !cancelled() &&
      (needs.renovate.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs['qualification-only'] == true &&
        needs.renovate.result == 'skipped')) &&
      ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
        !(github.event_name == 'workflow_dispatch' && inputs['qualification-only'] == true)) ||
       (github.event_name == 'workflow_dispatch' && inputs['qualification-only'] == true))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      active: ${{ steps.find.outputs.active }}
      head: ${{ steps.find.outputs.head }}
      base: ${{ steps.find.outputs.base }}
      number: ${{ steps.find.outputs.number }}
    steps:
      - name: Checkout trusted PatchRaptor qualification code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Find the exact PatchRaptor OMP PR
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/joshyorko/review/pulls?state=open&head=joshyorko%3Apatchraptor%2Fomp-runtime&base=main' > "$RUNNER_TEMP/review-pr.json"
          count="$(jq 'length' "$RUNNER_TEMP/review-pr.json")"
          if [ "$count" -eq 0 ]; then
            echo 'active=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$count" -eq 1
          jq -e '.[0] | .user.login == "patchraptor[bot]" and .head.repo.full_name == "joshyorko/review" and .head.ref == "patchraptor/omp-runtime"' "$RUNNER_TEMP/review-pr.json" > /dev/null
          {
            echo 'active=true'
            jq -r '.[0] | "head=\(.head.sha)\nbase=\(.base.sha)\nnumber=\(.number)"' "$RUNNER_TEMP/review-pr.json"
          } >> "$GITHUB_OUTPUT"
      - name: Fetch and check the candidate
        if: steps.find.outputs.active == 'true'
        env:
          PR_HEAD: ${{ steps.find.outputs.head }}
          PR_BASE: ${{ steps.find.outputs.base }}
        run: |
          set -euo pipefail
          [[ "$PR_HEAD" =~ ^[0-9a-f]{40}$ && "$PR_BASE" =~ ^[0-9a-f]{40}$ ]]
          git init review
          git -C review remote add origin https://github.com/joshyorko/review.git
          git -C review fetch --no-tags origin "$PR_HEAD" "$PR_BASE"
          git -C review checkout --detach "$PR_HEAD"
          python3 scripts/review-sdk-lock.py check-changes review "$PR_BASE" "$PR_HEAD"
      - name: Synchronize published OMP pins from trusted PatchRaptor code
        id: sync
        if: steps.find.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/sync-review-omp-pins.py review/image/appliance/Containerfile \
            > "$RUNNER_TEMP/review-omp-pin-sync.log" 2>&1 || {
              cat "$RUNNER_TEMP/review-omp-pin-sync.log"
              exit 1
            }
          cat "$RUNNER_TEMP/review-omp-pin-sync.log"
      - name: Synchronize SDK manifest and lock from trusted Review base
        id: sdk_sync
        if: steps.find.outputs.active == 'true' && steps.sync.outcome == 'success'
        env:
          PR_BASE: ${{ steps.find.outputs.base }}
        run: |
          set -euo pipefail
          python3 scripts/review-sdk-lock.py synchronize review "$PR_BASE" \
            review/image/appliance/Containerfile \
            > "$RUNNER_TEMP/review-omp-sdk-lock.log" 2>&1 || {
              cat "$RUNNER_TEMP/review-omp-sdk-lock.log"
              exit 1
            }
          cat "$RUNNER_TEMP/review-omp-sdk-lock.log"
      - name: Run exact-source qualification
        id: qualify
        if: steps.find.outputs.active == 'true' && steps.sync.outcome == 'success' && steps.sdk_sync.outcome == 'success'
        working-directory: review
        run: |
          node scripts/qualify-omp-upgrade.mjs --record > "$RUNNER_TEMP/review-omp-qualification.log" 2>&1 || {
            cat "$RUNNER_TEMP/review-omp-qualification.log"
            exit 1
          }
      - name: Report qualification stage
        if: always() && steps.find.outputs.active == 'true'
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          SDK_SYNC_OUTCOME: ${{ steps.sdk_sync.outcome }}
          QUALIFY_OUTCOME: ${{ steps.qualify.outcome }}
          PR_HEAD: ${{ steps.find.outputs.head }}
          QUALIFICATION_ONLY: ${{ inputs['qualification-only'] == true }}
        run: |
          set -euo pipefail
          if [ "$SYNC_OUTCOME" = failure ]; then
            {
              echo '## Review OMP qualification failed: published pins unavailable'
              echo
              printf 'PatchRaptor could not resolve or validate the published OMP source, archive, or native package pins for PR head %s. No qualification ran and no Review write was attempted. See the review-omp-qualification-logs artifact.\n' "$PR_HEAD"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$QUALIFY_OUTCOME" = failure ]; then
            {
              echo '## Review OMP qualification failed: patch/build/canary stage'
              echo
              printf 'Published OMP pins resolved, but exact-source patch/build/canary qualification failed for PR head %s. No Review write was attempted. See the review-omp-qualification-logs artifact.\n' "$PR_HEAD"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SDK_SYNC_OUTCOME" = failure ]; then
            {
              echo '## Review OMP qualification failed: trusted SDK lock synchronization'
              echo
              printf 'Published OMP pins resolved, but the SDK manifest/lock could not be reproduced from the trusted Review base for PR head %s. No qualification or Review write was attempted. See the review-omp-qualification-logs artifact.\n' "$PR_HEAD"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$QUALIFY_OUTCOME" = success ]; then
            {
              echo '## Review OMP qualification passed'
              echo
              if [ "$QUALIFICATION_ONLY" = true ]; then
                printf 'Published pins synchronized and exact-source patch/build/canary qualification passed for PR head %s. Qualification-only mode intentionally skipped the writer.\n' "$PR_HEAD"
              else
                printf 'Published pins synchronized and exact-source patch/build/canary qualification passed for PR head %s. The separate writer will recheck the exact PR head and independently verify the OMP pins, receipts, and trusted-base SDK lock.\n' "$PR_HEAD"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$SYNC_OUTCOME" = failure ] || [ "$SDK_SYNC_OUTCOME" = failure ] || [ "$QUALIFY_OUTCOME" = failure ]; then
            {
              printf '\n### Failure details\n\n'
              echo '```text'
              for log in "$RUNNER_TEMP/review-omp-pin-sync.log" "$RUNNER_TEMP/review-omp-sdk-lock.log" "$RUNNER_TEMP/review-omp-qualification.log"; do
                if [ -f "$log" ]; then tail -n 25 "$log"; fi
              done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain qualification logs
        if: always() && steps.find.outputs.active == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-omp-qualification-logs
          path: ${{ runner.temp }}/review-omp-*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stage qualified receipt files
        if: steps.find.outputs.active == 'true' && steps.qualify.outcome == 'success'
        id: artifact
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/review-omp-qualified"
          mkdir -p "$output/image/appliance"
          cp review/image/appliance/Containerfile "$output/image/appliance/Containerfile"
          if [ -f review/ci/sdk-types/package.json ] || [ -f review/ci/sdk-types/package-lock.json ]; then
            test -f review/ci/sdk-types/package.json
            test -f review/ci/sdk-types/package-lock.json
            mkdir -p "$output/ci/sdk-types"
            cp review/ci/sdk-types/package.json review/ci/sdk-types/package-lock.json "$output/ci/sdk-types/"
          fi
      - name: Save qualified receipts
        if: steps.find.outputs.active == 'true' && steps.qualify.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-omp-qualified-files
          path: ${{ runner.temp }}/review-omp-qualified/**
          if-no-files-found: error

  record-review-omp:
    name: Record Review OMP qualification on the exact PR head
    needs: qualify-review-omp
    if: needs.qualify-review-omp.outputs.active == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs['qualification-only'] == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted PatchRaptor verification
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-omp-qualified-files
          path: qualified
      - name: Verify exact candidate and SDK lock before writer token
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ needs.qualify-review-omp.outputs.head }}
          PR_BASE: ${{ needs.qualify-review-omp.outputs.base }}
          PR_NUMBER: ${{ needs.qualify-review-omp.outputs.number }}
        run: |
          exec > "$RUNNER_TEMP/review-omp-writer-verification.log" 2>&1
          set -euo pipefail
          [[ "$PR_HEAD" =~ ^[0-9a-f]{40}$ && "$PR_BASE" =~ ^[0-9a-f]{40}$ && "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh api "repos/joshyorko/review/pulls/$PR_NUMBER" > "$RUNNER_TEMP/current-pr.json"
          jq -e --arg head "$PR_HEAD" --arg base "$PR_BASE" '
            .state == "open" and .user.login == "patchraptor[bot]" and
            .head.repo.full_name == "joshyorko/review" and .head.ref == "patchraptor/omp-runtime" and
            .base.ref == "main" and .head.sha == $head and .base.sha == $base
          ' "$RUNNER_TEMP/current-pr.json" > /dev/null
          git init review
          git -C review remote add origin https://github.com/joshyorko/review.git
          git -C review fetch --no-tags origin "$PR_HEAD" "$PR_BASE"
          git -C review checkout --detach "$PR_HEAD"
          python3 scripts/review-sdk-lock.py check-changes review "$PR_BASE" "$PR_HEAD"
          python3 scripts/verify-review-qualification.py review review/image/appliance/Containerfile \
            qualified/image/appliance/Containerfile --base-ref "$PR_BASE" --qualified-root qualified
      - name: Retain writer verification log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-omp-writer-verification-log
          path: ${{ runner.temp }}/review-omp-writer-verification.log
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize writer verification failure
        if: always() && steps.verify.outcome == 'failure'
        run: |
          {
            echo '## Review OMP writer verification failed'
            echo
            echo 'The exact PR or independently regenerated SDK lock did not match the qualified artifact. No Review writer token was minted. See artifact review-omp-writer-verification-log.'
            echo
            echo '```text'
            tail -n 30 "$RUNNER_TEMP/review-omp-writer-verification.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Mint Review-scoped writer token
        id: review-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          client-id: ${{ secrets.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: joshyorko
          repositories: review
          permission-contents: write
          permission-pull-requests: read
      - name: Recheck exact candidate and push qualified files
        env:
          GH_TOKEN: ${{ steps.review-token.outputs.token }}
          PR_HEAD: ${{ needs.qualify-review-omp.outputs.head }}
          PR_BASE: ${{ needs.qualify-review-omp.outputs.base }}
          PR_NUMBER: ${{ needs.qualify-review-omp.outputs.number }}
        run: |
          set -euo pipefail
          [[ "$PR_HEAD" =~ ^[0-9a-f]{40}$ && "$PR_BASE" =~ ^[0-9a-f]{40}$ && "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh api "repos/joshyorko/review/pulls/$PR_NUMBER" > "$RUNNER_TEMP/current-pr-before-push.json"
          jq -e --arg head "$PR_HEAD" --arg base "$PR_BASE" '
            .state == "open" and .user.login == "patchraptor[bot]" and
            .head.repo.full_name == "joshyorko/review" and .head.ref == "patchraptor/omp-runtime" and
            .base.ref == "main" and .head.sha == $head and .base.sha == $base
          ' "$RUNNER_TEMP/current-pr-before-push.json" > /dev/null
          if cmp -s review/image/appliance/Containerfile qualified/image/appliance/Containerfile; then
            if [ ! -f qualified/ci/sdk-types/package.json ] || \
               { cmp -s review/ci/sdk-types/package.json qualified/ci/sdk-types/package.json && \
                 cmp -s review/ci/sdk-types/package-lock.json qualified/ci/sdk-types/package-lock.json; }; then
              echo 'OMP qualification receipts and SDK lock are already current.'
              exit 0
            fi
          fi
          cp qualified/image/appliance/Containerfile review/image/appliance/Containerfile
          git -C review add image/appliance/Containerfile
          if [ -f qualified/ci/sdk-types/package.json ]; then
            mkdir -p review/ci/sdk-types
            cp qualified/ci/sdk-types/package.json qualified/ci/sdk-types/package-lock.json review/ci/sdk-types/
            git -C review add ci/sdk-types/package.json ci/sdk-types/package-lock.json
          fi
          if git -C review diff --cached --quiet; then
            echo 'No qualified file changes to record.'
            exit 0
          fi
          git -C review config user.name 'patchraptor[bot]'
          git -C review config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C review commit -m 'fix: qualify OMP compatibility patches'
          gh auth setup-git
          git -C review push --force-with-lease="refs/heads/patchraptor/omp-runtime:$PR_HEAD" origin HEAD:refs/heads/patchraptor/omp-runtime
